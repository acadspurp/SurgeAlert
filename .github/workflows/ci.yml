name: CI

on:
  push:
    branches: [main, master, fr]
  pull_request:
    branches: [main, master, fr]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -DskipTests package
      - run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/WebApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/WebApp/package-lock.json
      - run: npm ci
      - run: npm run build

  edge-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile EdgeSystem/config/settings.py EdgeSystem/alert_logic/alert_manager.py EdgeSystem/system_main/edge_sync.py
