# SERVER
server.port=${SERVER_PORT:8080}

# Load root .env for local development (production should use host env vars directly)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]


# DATABASE
# --- Render PostgreSQL (uncomment these & comment MySQL lines below to switch) ---
#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/surgealert_db}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- Local MySQL (active) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/surgealert_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}


# JPA / HIBERNATE
# --- PostgreSQL dialect (uncomment when using Postgres) ---
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila

# AES-128 key for encrypted columns (phone numbers); must normalize to 16 bytes — use exactly 16 chars or set a longer string (first 16 bytes used)
surgealert.encryption.secret=${SURGE_ENCRYPTION_SECRET:}




# --- NEW REQUIRED LINE (Security Check) ---
# This must match the EDGE_API_KEY in your Python settings.py
app.edge-api-key=${EDGE_API_KEY:}

# --- Security hardening controls ---
surgealert.rate-limit.default-per-minute=120
surgealert.rate-limit.auth-per-minute=12
surgealert.rate-limit.otp-per-minute=8
surgealert.rate-limit.reports-per-minute=5

# --- Feature rollout controls ---
surgealert.canary.enabled=${SURGE_CANARY_ENABLED:false}
surgealert.canary.percentage=${SURGE_CANARY_PERCENTAGE:5}
surgealert.canary.sensor-allowlist=${SURGE_CANARY_SENSOR_ALLOWLIST:}

# --- Human-in-the-loop for critical alerts ---
surgealert.human-envelope.enabled=true
surgealert.human-envelope.approval-timeout-seconds=180

# --- RED high-confidence protocol ---
# Sensor physical depth from riverbed to mount — calibration constant, not a secret.
# ✏️  TO UPDATE THE DEPTH: Change the value below (and mirror it in EdgeSystem/config/settings.py).
#     This file is tracked by git, so the change persists after every push.
surgealert.sensor.depth-m=6.0
surgealert.confidence.smoothing-window=${SMOOTHING_WINDOW:5}
surgealert.confidence.max-delta-m-per-cycle=${MAX_DELTA_M_PER_CYCLE:0.75}
surgealert.confidence.cv-min-flow-mps=${CV_MIN_FLOW_MPS:0.05}
surgealert.confidence.cv-min-rise-mps=${CV_MIN_RISE_MPS:0.005}

# --- Report guardrails ---
surgealert.reports.max-range-days=31

# --- Hybrid OTP delivery ---
surgealert.otp.online-preferred=true
surgealert.semaphore.enabled=${SEMAPHORE_ENABLED:false}
surgealert.semaphore.api-url=${SEMAPHORE_API_URL:https://api.semaphore.co/api/v4/messages}
surgealert.semaphore.api-key=${SEMAPHORE_API_KEY:}
surgealert.semaphore.sender-name=${SEMAPHORE_SENDER_NAME:SurgeAlert}


# EMAIL CONFIGURATION (Using Gmail App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
# Replace 'xxxx' below with your actual 16-character Google App Password
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000


# EXTERNAL API (WorldTides)
worldtides.api.key=${WORLDTIDES_API_KEY:}
surgealert.tides.cache-max-age-days=${SURGE_TIDES_CACHE_MAX_AGE_DAYS:2}

# --- MQTT CONFIGURATION (HiveMQ Cloud Serverless) ---
# Use ssl:// instead of tcp:// for secure MQTTS connection
#mqtt.broker.url=ssl://5e0a5aad5d044a2599132ffac1022393.s1.eu.hivemq.cloud:8883
mqtt.broker.username=${MQTT_BROKER_USERNAME:}
mqtt.broker.password=${MQTT_BROKER_PASSWORD:}
mqtt.client.id=${MQTT_CLIENT_ID:surgealert-backend}
# MQTT Configuration (defaults match Render production env)
mqtt.broker.url=${MQTT_BROKER_URL:ssl://5e0a5aad5d044a2599132ffac1022393.s1.eu.hivemq.cloud:8883}
mqtt.topic.sensor=${MQTT_TOPIC_SENSOR:sensor/data}
mqtt.use-ssl=${MQTT_USE_SSL:true}

# Hydrological Thresholds (Standardized)
surgealert.thresholds.yellow=3.50
surgealert.thresholds.orange=4.50
surgealert.thresholds.red=5.50

# Demo Controls
# --- ML auto-retrain (Postgres → XGBoost → Pi OTA download) ---
surgealert.ml.model-dir=data/models
surgealert.ml.edge-system-dir=EdgeSystem
surgealert.ml.retrain-enabled=true
surgealert.ml.retrain-cron=0 0 4 * * SUN
surgealert.ml.retrain-days=90
surgealert.ml.retrain-min-rows=80

# CORS: comma-separated origin patterns for browser clients
surgealert.cors.allowed-origin-patterns=${SURGE_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}