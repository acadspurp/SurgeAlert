# SERVER
server.port=8080

# DATABASE — set via environment in production (never commit real credentials)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/surgealert_db?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# JPA / HIBERNATE (disable SQL logging in production)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# AES key for encrypted phone columns (16 bytes); prefer SURGE_ENCRYPTION_SECRET in env
surgealert.encryption.secret=${SURGE_ENCRYPTION_SECRET:SurgeAlertSecret}

# HMAC for phone lookup (optional; defaults to UTF-8 bytes of encryption secret if unset)
surgealert.phone-hash.secret=${SURGE_PHONE_HASH_SECRET:}

# JWT (HS256 requires >= 256 bits / strong secret in practice — use a long random string in env)
surgealert.jwt.secret=${SURGE_JWT_SECRET:ChangeThisToALongRandomSecretStringForJwtSigning!!}
surgealert.jwt.expiration-hours=${SURGE_JWT_EXPIRATION_HOURS:12}

# Edge device ingest — must match EDGE_API_KEY in EdgeSystem (set a strong value in production)
app.edge-api-key=${EDGE_API_KEY:surge-alert-secret-123}

# CORS: comma-separated origins (browser clients). Example: http://localhost:5173,http://127.0.0.1:5173
surgealert.cors.allowed-origins=${SURGE_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# OTP: never return OTP in JSON when false (production)
surgealert.otp.expose-in-response=${SURGE_OTP_EXPOSE_IN_RESPONSE:false}

# First-time admin bootstrap: only runs when there are zero users and password is non-empty
surgealert.bootstrap.admin-username=${SURGE_BOOTSTRAP_ADMIN_USER:headadmin}
surgealert.bootstrap.admin-password=${SURGE_BOOTSTRAP_ADMIN_PASSWORD:}

# Report export cap (rows)
surgealert.export.max-rows=${SURGE_EXPORT_MAX_ROWS:50000}

# FIREBASE (optional)
app.firebase-configuration-file=${FIREBASE_CONFIG_FILE:}

# EMAIL — use env for credentials
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# WorldTides API
worldtides.api.key=${WORLDTIDES_API_KEY:}

# MQTT
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.broker.username=${MQTT_USERNAME:}
mqtt.broker.password=${MQTT_PASSWORD:}
mqtt.client.id=${MQTT_CLIENT_ID:surgealert-backend}
mqtt.topic.sensor=${MQTT_TOPIC_SENSOR:sensor/data}
mqtt.use-ssl=${MQTT_USE_SSL:false}
