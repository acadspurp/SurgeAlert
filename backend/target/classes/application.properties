# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080

# ==========================================
# DATABASE CONFIGURATION (MySQL)
# ==========================================
# Standard connection string for MySQL 8.0+
# Use environment variables for deployment, fallback to local defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/surgealert_db?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# Let Spring Boot auto-detect the Dialect based on the database connection URL
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 'update' keeps existing data and updates schema. Use 'create' to reset DB.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# LOGGING
# ==========================================
logging.level.com.surgealert=DEBUG
logging.level.org.springframework.security=DEBUG

# ==========================================
# JWT CONFIGURATION
# ==========================================
# Secret key for signing JWTs. In production, use environment variables!
app.jwt.secret=${JWT_SECRET:8f2a3c9b7e4d1f5a6b2c8d9e3f4a1b7c2d8e9f0a5b6c7d8e9f0a1b2c3d4e5f6}
app.jwt.expiration-ms=86400000

# ==========================================
# EMAIL CONFIGURATION (Temporary GSM Replacement)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# REPLACE THIS with the email address you are sending FROM
spring.mail.username=surgealert.system@gmail.com

# REPLACE THIS with your 16-character Google App Password
# Do NOT use your normal Gmail login password.
spring.mail.password=xxxx xxxx xxxx xxxx

# Mail Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

