# SERVER
server.port=8080

# DATABASE (MySQL)
# Update 'username' and 'password' with your actual MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/surgealert_db?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password

# JPA / HIBERNATE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# FIREBASE
app.firebase-configuration-file=classpath:firebase-service-account.json

# --- NEW REQUIRED LINE (Security Check) ---
# This must match the EDGE_API_KEY in your Python settings.py
app.edge-api-key=surge-alert-secret-123

# EMAIL CONFIGURATION (Using Gmail App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=surgealert.system@gmail.com
# Replace 'xxxx' below with your actual 16-character Google App Password
spring.mail.password=xxxx xxxx xxxx xxxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# EXTERNAL API (WorldTides)
worldtides.api.key=4e9f736f-06ac-46a4-bebc-537e9cb8b200