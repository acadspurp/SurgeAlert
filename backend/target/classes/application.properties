# SERVER
server.port=8080


# DATABASE (MySQL)
# Update 'username' and 'password' with your actual MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/surgealert_db?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1010


# JPA / HIBERNATE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AES-128 key for encrypted columns (phone numbers); must normalize to 16 bytes — use exactly 16 chars or set a longer string (first 16 bytes used)
surgealert.encryption.secret=${SURGE_ENCRYPTION_SECRET:SurgeAlertSecret}


# FIREBASE
#app.firebase-configuration-file=classpath:firebase-service-account.json
# Note: Use file: instead of classpath: and use forward slashes /
app.firebase-configuration-file=file:C:/Surge/SurgeAlert/backend/src/main/resources/firebase-service-account.json

# --- NEW REQUIRED LINE (Security Check) ---
# This must match the EDGE_API_KEY in your Python settings.py
app.edge-api-key=surge-alert-secret-123

# --- Security hardening controls ---
surgealert.rate-limit.default-per-minute=120
surgealert.rate-limit.auth-per-minute=12
surgealert.rate-limit.otp-per-minute=8
surgealert.rate-limit.reports-per-minute=5

# --- Feature rollout controls ---
surgealert.canary.enabled=false
surgealert.canary.percentage=5

# --- Human-in-the-loop for critical alerts ---
surgealert.human-envelope.enabled=true
surgealert.human-envelope.approval-timeout-seconds=180

# --- Report guardrails ---
surgealert.reports.max-range-days=31

# --- Hybrid OTP delivery ---
surgealert.otp.online-preferred=true
surgealert.semaphore.enabled=false
surgealert.semaphore.api-url=https://api.semaphore.co/api/v4/messages
surgealert.semaphore.api-key=
surgealert.semaphore.sender-name=SurgeAlert


# EMAIL CONFIGURATION (Using Gmail App Password)
